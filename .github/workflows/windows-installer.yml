name: Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.event_name != 'issues' || github.event.issue.title == '[BUILD] Windows installer'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check whether this version is already published
        id: release-check
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is already published; nothing to do."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is not published yet; building."
          fi

      - name: Install dependencies
        if: github.event_name == 'pull_request' || steps.release-check.outputs.already_published != 'true'
        run: npm install --no-audit --no-fund

      - name: Build Next.js
        if: github.event_name == 'pull_request' || steps.release-check.outputs.already_published != 'true'
        run: npm run build

      - name: Build Windows installer (PR validation)
        if: github.event_name == 'pull_request'
        run: npx electron-builder --win nsis --publish never

      - name: Build Windows installer and publish release
        if: github.event_name != 'pull_request' && steps.release-check.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Upload installer artifact
        if: github.event_name == 'pull_request' || (github.event_name != 'pull_request' && steps.release-check.outputs.already_published != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: Famiglia-Grassi-Windows
          path: installer/*.exe
          if-no-files-found: error
